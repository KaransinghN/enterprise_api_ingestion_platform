
# resources/jobs/landing_file_processing.job.yml
#
# Purpose:
#   Monitor the Unity Catalog landing volume for new files.
#   When enabled, start the Bronze -> Silver -> Gold pipeline chain.
#
# Important:
#   - The file-arrival trigger is enabled for automatic processing.
#   - This job does not run the API ingestion wheel task.
#   - The monitored path must match the actual landing volume.
#   - Bronze must be able to discover and process newly landed data.

resources:
  jobs:
    landing_file_processing_job:
      name: landing-file-processing-${bundle.target}

      # Prevent concurrent executions of this processing job.
      max_concurrent_runs: 1

      queue:
        enabled: true

      # ============================================================
      # FILE-ARRIVAL TRIGGER
      # ============================================================
      #
      # Monitor the root of the configured Unity Catalog volume.
      #
      # UNPAUSED enables file-arrival-triggered processing.
      #
      # The minimum interval and quiet period help coalesce bursts
      # of arriving files; this is not an instantaneous notification.
      #
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${var.landing_catalog}/${var.landing_schema}/${var.landing_volume}/
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60

      # ============================================================
      # NOTIFICATIONS
      # ============================================================
      email_notifications:
        on_success:
          - karansingh.n@brillio.com
        on_failure:
          - karansingh.n@brillio.com

      # ============================================================
      # TASKS
      # ============================================================
      tasks:
        # ----------------------------------------------------------
        # BRONZE
        # First processing stage after a file-arrival trigger.
        # ----------------------------------------------------------
        - task_key: bronze_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_pipeline.id}

        # ----------------------------------------------------------
        # SILVER
        # Runs only after Bronze succeeds.
        # ----------------------------------------------------------
        - task_key: silver_pipeline
          depends_on:
            - task_key: bronze_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_pipeline.id}

        # ----------------------------------------------------------
        # GOLD
        # Runs only after Silver succeeds.
        # ----------------------------------------------------------
        - task_key: gold_pipeline
          depends_on:
            - task_key: silver_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_pipeline.id}
