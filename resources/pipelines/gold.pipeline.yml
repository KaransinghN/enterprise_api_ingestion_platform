#resources/pipelines/gold.pipeline.yml

resources:
  pipelines:
    gold_pipeline:
      name: enterprise-api-gold-${bundle.target}

      catalog: ${var.catalog}
      schema: ${resources.schemas.gold_schema.name}

      serverless: true

      continuous: false

      configuration:
        SILVER_CATALOG: ${var.catalog}
        SILVER_SCHEMA: ${resources.schemas.silver_schema.name}

      libraries:
        - file:
            path: ../../src/enterprise_api_ingestion_platform/gold/gold_pipeline.py
        - file:
            path: ../../src/enterprise_api_ingestion_platform/gold/transformations.py
