name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run unit and application tests
        run: uv run pytest -q --ignore=tests/gold --ignore=tests/silver

  integration-tests:
    name: Databricks Integration Tests
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: https://dbc-7b9faa8e-9cac.cloud.databricks.com
      DATABRICKS_CLIENT_ID: f5fb7304-bf5c-4716-a69c-1f99f8f67c14
      RUN_DATABRICKS_TESTS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.8.0

      - name: Verify Databricks authentication
        run: databricks current-user me

      - name: Validate Databricks bundle
        run: databricks bundle validate -t dev

      - name: Deploy Databricks bundle to DEV
        run: databricks bundle deploy -t dev

      - name: Resolve deployed DEV schemas
        shell: bash
        run: |
          SUMMARY="$(databricks bundle summary -t dev --output json)"

          BRONZE_SCHEMA="$(printf '%s' "$SUMMARY" | jq -r '.resources.schemas.bronze_schema.name')"
          SILVER_SCHEMA="$(printf '%s' "$SUMMARY" | jq -r '.resources.schemas.silver_schema.name')"
          GOLD_SCHEMA="$(printf '%s' "$SUMMARY" | jq -r '.resources.schemas.gold_schema.name')"

          test -n "$BRONZE_SCHEMA"
          test -n "$SILVER_SCHEMA"
          test -n "$GOLD_SCHEMA"

          {
            echo "DATABRICKS_TEST_CATALOG=enterprise_api_dev"
            echo "DATABRICKS_TEST_BRONZE_SCHEMA=$BRONZE_SCHEMA"
            echo "DATABRICKS_TEST_SILVER_SCHEMA=$SILVER_SCHEMA"
            echo "DATABRICKS_TEST_GOLD_SCHEMA=$GOLD_SCHEMA"
          } >> "$GITHUB_ENV"

      - name: Run Databricks integration tests
        run: uv run pytest tests/gold tests/silver -q