# databricks.yml

bundle:
  name: enterprise_api_ingestion_platform
  uuid: 2b9b461d-df4d-479e-af7e-3a9a2fa7c7d9
  engine: direct

include:
  - resources/**/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    description: The catalog to use

  schema:
    description: The schema to use

  environment:
    description: Deployment environment

  landing_catalog:
    description: Unity Catalog catalog containing the landing volume

  landing_schema:
    description: Unity Catalog schema containing the landing volume

  landing_volume:
    description: Unity Catalog landing volume name

  metadata_schema:
    description: Unity Catalog schema containing API metadata and checkpoints

  audit_schema:
    description: Unity Catalog schema containing execution audit tables

targets:
  dev:
    mode: development
    default: true

    workspace:
      host: https://dbc-7b9faa8e-9cac.cloud.databricks.com

    variables:
      catalog: enterprise_api_dev
      schema: bronze
      environment: dev

      landing_catalog: enterprise_api_dev
      landing_schema: ${resources.schemas.landing_schema.name}
      landing_volume: landing_volume
      metadata_schema: ${resources.schemas.config_schema.name}
      audit_schema: ${resources.schemas.audit_schema.name}

  prod:
    mode: production

    workspace:
      host: https://dbc-83c2a237-8434.cloud.databricks.com

      root_path: /Workspace/Users/f5fb7304-bf5c-4716-a69c-1f99f8f67c14/.bundle/${bundle.name}/${bundle.target}

    run_as:
      service_principal_name: f5fb7304-bf5c-4716-a69c-1f99f8f67c14

    variables:
      catalog: enterprise_api_prod
      schema: bronze
      environment: prod

      landing_catalog: enterprise_api_prod
      landing_schema: landing
      landing_volume: landing_volume
      metadata_schema: ${resources.schemas.config_schema.name}
      audit_schema: ${resources.schemas.audit_schema.name}


