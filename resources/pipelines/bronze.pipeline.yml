resources:
  pipelines:
    bronze_pipeline:
      name: enterprise-api-bronze-${bundle.target}

      catalog: ${var.catalog}
      schema: ${resources.schemas.bronze_schema.name}

      serverless: true

      continuous: false

      configuration:
        LANDING_CATALOG: ${var.landing_catalog}
        LANDING_SCHEMA: ${resources.schemas.landing_schema.name}
        LANDING_VOLUME: ${var.landing_volume}

        METADATA_CATALOG: ${var.catalog}
        METADATA_SCHEMA: ${resources.schemas.config_schema.name}

      libraries:
        - file:
            path: ../../src/enterprise_api_ingestion_platform/bronze_pipeline/bronze_pipeline.py