#resources\pipelines\silver.pipeline.yml
resources:
  pipelines:
    silver_pipeline:
      name: enterprise-api-silver-${bundle.target}

      catalog: ${var.catalog}
      schema: ${resources.schemas.silver_schema.name}

      serverless: true

      continuous: false

      configuration:
        METADATA_CATALOG: ${var.catalog}
        METADATA_SCHEMA: ${resources.schemas.config_schema.name}

      libraries:
        - file:
            path: ../../src/enterprise_api_ingestion_platform/silver/silver_pipeline.py